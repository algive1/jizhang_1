services:
  admin-web:
    build: .
    environment:
      ADMIN_API_UPSTREAM: ${ADMIN_API_UPSTREAM:-app:8787}
    networks:
      - existing-backend
    ports:
      - 127.0.0.1:8080:80
    restart: unless-stopped
networks:
  existing-backend:
    external: true
    name: ${BACKEND_NETWORK:?Set the existing backend Docker network}
