services:
  admin-api:
    build: ../server
    env_file: ../server/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      LEDGER_DB_PATH: /data/shared-ledger.sqlite
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?Set the initial administrator password}
    volumes:
      - ledger-data:/data
      - ledger-backups:/backups
    restart: unless-stopped
  admin-web:
    build: .
    depends_on:
      - admin-api
    ports:
      - 127.0.0.1:8080:80
    restart: unless-stopped
volumes:
  ledger-data:
  ledger-backups:
