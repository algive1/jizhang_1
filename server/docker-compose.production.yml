services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ledger-data:/data
      - ledger-backups:/backups
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["node", "scripts/backup_loop.mjs"]
    volumes:
      - ledger-data:/data
      - ledger-backups:/backups
    depends_on:
      app:
        condition: service_healthy

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["node", "scripts/monitor.mjs"]
    depends_on:
      app:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ledger-data:
  ledger-backups:
  caddy-data:
  caddy-config:
