services:
  app:
    image: ${BACKEND_IMAGE:-haohao-backend:local}
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_IMAGE: ${BACKEND_IMAGE:-haohao-backend:local}
      BACKEND_VERSION: ${BACKEND_VERSION:-development}
    volumes:
      - ledger-data:/data
      - ledger-backups:/backups
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["node", "scripts/backup_loop.mjs"]
    volumes:
      - ledger-data:/data
      - ledger-backups:/backups
    depends_on:
      app:
        condition: service_healthy

  monitor:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["node", "scripts/monitor.mjs"]
    depends_on:
      app:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
      admin-web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  admin-web:
    build: ../admin-web
    restart: unless-stopped
    environment:
      ADMIN_API_UPSTREAM: app:8787
    expose:
      - "80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  ledger-data:
  ledger-backups:
  caddy-data:
  caddy-config:
