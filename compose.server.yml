services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      LEDGER_DB_PATH: /data/shared-ledger.sqlite
    ports:
      - "${SERVER_PORT:-8787}:8787"
    volumes:
      - haohao-data:/data
volumes:
  haohao-data:
