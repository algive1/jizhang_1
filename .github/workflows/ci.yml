name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-core:
    name: Flutter core checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Run account core tests
        run: >
          flutter test --reporter compact
          test/account_guest_to_login_regression_test.dart
          test/account_session_expired_regression_test.dart
          test/account_phase2_session_test.dart
          test/account_pending_intent_test.dart
          test/account_phase2_test.dart
          test/account_dataset_binding_test.dart
          test/account_cloud_attachment_restore_test.dart
          test/local_backup_service_test.dart
          test/app_update_service_test.dart
          test/product_analytics_test.dart
          test/push_registration_service_test.dart
          test/ad_placement_test.dart
          test/ad_placement_readiness_test.dart
          test/app_scaffold_navigation_test.dart
          test/database_seeder_test.dart
          test/book_selector_ui_test.dart
          test/consumption_calendar_test.dart
          test/budget_alert_notification_service_test.dart
          test/budget_and_management_test.dart
          test/budget_recommendation_service_test.dart
          test/statistical_analysis_service_test.dart
          test/financial_insight_engine_test.dart
          test/home_insight_drawer_test.dart
          test/home_redesign_domain_test.dart
          test/home_recent_transactions_test.dart
          test/analysis_multibook_and_annual_report_test.dart
          test/bookkeeping_template_repository_test.dart
          test/quick_bookkeeping_service_test.dart
          test/quick_add_redesign_test.dart
          test/recurring_bill_create_sheet_test.dart
          test/bill_screenshot_parser_test.dart
          test/membership_test.dart
          test/bill_import_service_test.dart
          test/bill_import_deduplicator_test.dart
          test/transaction_date_group_test.dart
          test/transaction_layout_test.dart
          test/transaction_detail_test.dart
          test/bill_import_category_mapper_test.dart
          test/xlsx_bill_import_test.dart
          test/category_template_upgrade_test.dart
          test/account_balance_effect_test.dart
          test/investment_repository_test.dart
          test/voice_parser_test.dart
          test/payment_notification_test.dart
          test/autobookkeeping_page_test.dart
          test/autobookkeeping_learning_test.dart
          test/autobookkeeping_refund_matcher_test.dart
          test/autobookkeeping_transfer_resolver_test.dart

      - name: Run Android auto-bookkeeping unit tests
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          gradle -p android :app:testDebugUnitTest \
            --tests "com.algive.jizhang_app.autobookkeeping.PaymentEngineTest"

      - name: Build Android debug APK
        run: flutter build apk --debug

  ios-native:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS simulator
        run: flutter build ios --simulator --debug

      - name: Verify APNs build environments
        run: |
          xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Debug -showBuildSettings | grep -q "APS_ENVIRONMENT = development"
          xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Release -showBuildSettings | grep -q "APS_ENVIRONMENT = production"

  server-core:
    name: Server core checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
