name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-core:
    name: Flutter core checks
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate release scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build_apk_release.sh
          bash -n scripts/build_install_android.sh
          bash -n scripts/android_release_preflight.sh
          bash scripts/android_release_preflight.sh --local
          if SHARED_API_BASE_URL=https://api.invalid.example bash scripts/android_release_preflight.sh --production; then
            echo "::error::Production preflight unexpectedly passed without a private keystore"
            exit 1
          fi

      - name: Validate Android Gradle configuration
        working-directory: android
        run: ./gradlew :app:tasks --quiet

      - name: Analyze
        run: flutter analyze

      - name: Run account core tests
        run: >
          flutter test --reporter compact
          test/account_guest_to_login_regression_test.dart
          test/account_session_expired_regression_test.dart
          test/account_phase2_session_test.dart
          test/account_pending_intent_test.dart
          test/account_phase2_test.dart
          test/account_dataset_binding_test.dart
          test/account_cloud_attachment_restore_test.dart
          test/app_update_service_test.dart
          test/product_analytics_test.dart
          test/push_registration_service_test.dart
          test/ad_placement_test.dart
          test/ad_placement_readiness_test.dart

  server-core:
    name: Server core checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
